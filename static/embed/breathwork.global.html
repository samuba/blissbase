<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Breathwork Hamburg</title>
		<style>
			body {
				margin: 0;
				background: #f7f3ee;
				color: #3b322c;
				font-family: Georgia, "Times New Roman", serif;
			}
			header,
			main {
				padding: 2.5rem 10%;
			}
			header {
				padding-bottom: 0;
			}
			h1 {
				margin: 0 0 0.75rem;
				font-size: 2.6rem;
				font-weight: 400;
			}
			p {
				max-width: 40rem;
				line-height: 1.6;
			}
			/* Host-page styles. The snippet has to keep its own look anyway. */
			button,
			select,
			a,
			h4,
			img {
				all: unset;
			}
			button {
				display: inline-block;
				background: #c45c26;
				color: #fff;
				border-radius: 999px;
				padding: 0.8rem 1.4rem;
			}
			a {
				color: #c45c26;
				text-decoration: underline;
			}
		</style>
	</head>
	<body>
		<header>
			<h1>Breathwork Hamburg</h1>
			<p>Finde passende Events in deiner Nähe. Wähle einen Zeitraum und such nach Atemarbeit.</p>
		</header>
		<main>
			<script src="event-search-snippet.js" location-id="196" initial-limit="2" async></script>
			<div id="app"></div>
		</main>
	</body>
