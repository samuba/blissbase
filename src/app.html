<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" type="image/png" sizes="96x96" href="%sveltekit.assets%/favicon.png" />
	<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
	<link rel="shortcut icon" href="%sveltekit.assets%/favicon.ico" />
	<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
	<meta name="apple-mobile-web-app-title" content="Blissbase" />
	<meta name="viewport"
		content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />

	<link rel="mask-icon" href="%sveltekit.assets%/logo.svg" color="#ddac46">

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" class="bg-base-200 h-full min-h-screen">
	<div style="display: contents">%sveltekit.body%</div>
</body>

<script>
	// If site was opened in telegram webview, redirect to default browser
	if (window.TelegramWebview) {
		window.location.href = `intent://${window.location.href.replace(/^https?:\/\//, '')}#Intent;scheme=https;end`;
	}
</script>

</html>
