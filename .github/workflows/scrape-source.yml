name: Scrape single website source

on:
  workflow_call:
    inputs:
      source:
        description: 'Website scrape source name (e.g. yogabarn)'
        required: true
        type: string
      continue_on_error:
        description: 'If true, scrape failures do not fail this job (used for early Yoga Barn attempts)'
        required: false
        type: boolean
        default: false
      clean:
        description: 'If true, pass --clean so existing events for this source are deleted before insert'
        required: false
        type: boolean
        default: false
    outputs:
      ok:
        description: 'true when the scrape step succeeded'
        value: ${{ jobs.scrape.outputs.ok }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      ok: ${{ steps.scrape.outcome == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: scrape
        id: scrape
        continue-on-error: ${{ inputs.continue_on_error }}
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          TODOTODAY_EMAIL: ${{ secrets.TODOTODAY_EMAIL }}
          TODOTODAY_PASSWORD: ${{ secrets.TODOTODAY_PASSWORD }}
          SOURCE: ${{ inputs.source }}
          CLEAN: ${{ inputs.clean }}
        run: |
          if [ "$CLEAN" = "true" ]; then
            bun run scripts/scrape-websites.ts "$SOURCE" --clean
          else
            bun run scripts/scrape-websites.ts "$SOURCE"
          fi
