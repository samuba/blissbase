name: Website Scraping

on:
  schedule:
    # Runs at 00:00 and 12:00 UTC every day
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual triggering
    inputs:
      params:
        description: 'parameters to pass to the script'
        required: false
        type: string
        default: ''

jobs:
  # Yoga Barn is scraped in separate jobs below so each retry gets a new runner IP.
  scrape-websites:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.params == '' || !startsWith(github.event.inputs.params, 'yogabarn') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        # If you don't have a bun.lockb or package.json for dependencies,
        # and your script has no external Bun dependencies other than what's built-in
        # or vendored, you might be able to skip this step.
        # However, it's good practice if your scrapers or common.ts might add some.

      - name: Install Playwright dependencies
        run: bunx playwright install --with-deps chromium

      - name: scrape
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          TODOTODAY_EMAIL: ${{ secrets.TODOTODAY_EMAIL }}
          TODOTODAY_PASSWORD: ${{ secrets.TODOTODAY_PASSWORD }}
        run: bun run scripts/scrape-websites.ts ${{ github.event.inputs.params }} --exclude yogabarn

      # Same runner FS as scrape — no artifacts. Collapsible ::group:: per source; step goes red if any failed.
      - name: Per-source scrape logs
        if: always()
        run: bash scripts/print-scrape-log.sh --all

  # Each attempt is a new job → new GitHub-hosted runner → new public IP.
  # Bot protection flags some Azure IPs; retrying on the same IP makes it worse.
  # Run on schedule, empty/flag-only dispatch (--clean), or an explicit yogabarn source.
  # Skip when dispatch targets a different source (e.g. tribehaus).
  scrape-yogabarn-1:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.params == '' || startsWith(github.event.inputs.params, 'yogabarn') || startsWith(github.event.inputs.params, '--') }}
    uses: ./.github/workflows/scrape-source.yml
    with:
      source: yogabarn
      continue_on_error: true
      clean: ${{ contains(github.event.inputs.params, '--clean') }}
    secrets: inherit

  scrape-yogabarn-2:
    needs: [scrape-yogabarn-1]
    if: ${{ always() && needs.scrape-yogabarn-1.result != 'skipped' && needs.scrape-yogabarn-1.outputs.ok != 'true' }}
    uses: ./.github/workflows/scrape-source.yml
    with:
      source: yogabarn
      continue_on_error: true
      clean: ${{ contains(github.event.inputs.params, '--clean') }}
    secrets: inherit

  scrape-yogabarn-3:
    needs: [scrape-yogabarn-2]
    if: ${{ always() && needs.scrape-yogabarn-2.result != 'skipped' && needs.scrape-yogabarn-2.outputs.ok != 'true' }}
    uses: ./.github/workflows/scrape-source.yml
    with:
      source: yogabarn
      continue_on_error: false
      clean: ${{ contains(github.event.inputs.params, '--clean') }}
    secrets: inherit

  deduplicate:
    if: ${{ always() }}
    needs: [scrape-websites, scrape-yogabarn-1, scrape-yogabarn-2, scrape-yogabarn-3]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
      - name: Remove duplicates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: bun run scripts/remove-duplicates.ts ${{ github.event.inputs.params }}
