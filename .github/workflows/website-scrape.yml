name: Website Scraping

on:
  schedule:
    # Runs at 00:00 and 12:00 UTC every day
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual triggering
    inputs:
      params:
        description: 'parameters to pass to the script'
        required: false
        type: string
        default: ''

jobs:
  # Source list comes from WEBSITE_SCRAPER_CONFIG — not hardcoded here.
  plan:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.plan.outputs.sources }}
      has_sources: ${{ steps.plan.outputs.has_sources }}
      retry_source: ${{ steps.plan.outputs.retry_source }}
      clean: ${{ steps.plan.outputs.clean }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Plan scrape matrix
        id: plan
        run: bun run scripts/website-scrape-plan.ts ${{ github.event.inputs.params }}

  scrape:
    name: ${{ matrix.source }}
    needs: plan
    if: ${{ needs.plan.outputs.has_sources == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
    uses: ./.github/workflows/scrape-source.yml
    with:
      source: ${{ matrix.source }}
      clean: ${{ needs.plan.outputs.clean == 'true' }}
    secrets: inherit

  # retryOnNewIp sources (Yoga Barn): each attempt is a new job → new runner IP.
  # Bot protection flags some Azure IPs; retrying on the same IP makes it worse.
  retry-source-1:
    name: ${{ needs.plan.outputs.retry_source }}
    needs: plan
    if: ${{ needs.plan.outputs.retry_source != '' }}
    uses: ./.github/workflows/scrape-source.yml
    with:
      source: ${{ needs.plan.outputs.retry_source }}
      continue_on_error: true
      clean: ${{ needs.plan.outputs.clean == 'true' }}
    secrets: inherit

  retry-source-2:
    name: ${{ needs.plan.outputs.retry_source }} (retry 2)
    needs: [plan, retry-source-1]
    if: ${{ always() && needs.plan.outputs.retry_source != '' && needs.retry-source-1.result != 'skipped' && needs.retry-source-1.outputs.ok != 'true' }}
    uses: ./.github/workflows/scrape-source.yml
    with:
      source: ${{ needs.plan.outputs.retry_source }}
      continue_on_error: true
      clean: ${{ needs.plan.outputs.clean == 'true' }}
    secrets: inherit

  retry-source-3:
    name: ${{ needs.plan.outputs.retry_source }} (retry 3)
    needs: [plan, retry-source-2]
    if: ${{ always() && needs.plan.outputs.retry_source != '' && needs.retry-source-2.result != 'skipped' && needs.retry-source-2.outputs.ok != 'true' }}
    uses: ./.github/workflows/scrape-source.yml
    with:
      source: ${{ needs.plan.outputs.retry_source }}
      continue_on_error: false
      clean: ${{ needs.plan.outputs.clean == 'true' }}
    secrets: inherit

  deduplicate:
    if: ${{ always() }}
    needs: [plan, scrape, retry-source-1, retry-source-2, retry-source-3]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
      - name: Remove duplicates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: bun run scripts/remove-duplicates.ts ${{ github.event.inputs.params }}
